name: TradePlugin
version: 1.0
description: Plugin do handlu między graczami
main: pl.yourname.tradeplugin.TradePlugin
author: YourName
api-version: 1.20

commands:
  wymiana:
    description: Rozpocznij handel z innym graczem
    usage: /wymiana <gracz>
    permission: tradeplugin.trade
  wymianaakceptuj:
    description: Zaakceptuj prośbę o handel
    usage: /wymianaakceptuj
    permission: tradeplugin.trade
  wymianaodrzuc:
    description: Odrzuć prośbę o handel
    usage: /wymianaodrzuc
    permission: tradeplugin.trade

permissions:
  tradeplugin.*:
    description: Dostęp do wszystkich komend pluginu
    default: true
    children:
      tradeplugin.trade: true
  tradeplugin.trade:
    description: Pozwala na handel z innymi graczami
    default: true
