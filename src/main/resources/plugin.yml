name: TradePlugin
version: 1.0
description: Plugin do handlu między graczami
main: pl.yourname.tradeplugin.TradePlugin
author: YourName
api-version: 1.20

commands:
  wymiana:
    description: Rozpocznij handel z innym graczem
    usage: /wymiana <gracz>
    permission: tradeplugin.trade
  wymianazaakceptuj:
    description: Zaakceptuj prośbę o handel
    usage: /wymianazaakceptuj
    permission: tradeplugin.trade
  wymianaodrzuc:
    description: Odrzuć prośbę o handel
    usage: /wymianaodrzuc
    permission: tradeplugin.trade
  wymianahist:
    description: Zobacz historię handlu (dla adminów)
    usage: /wymianahist [gracz]
    permission: tradeplugin.admin

permissions:
  tradeplugin.*:
    description: Dostęp do wszystkich komend pluginu
    default: op
    children:
      tradeplugin.trade: true
      tradeplugin.admin: true
  tradeplugin.trade:
    description: Pozwala na handel z innymi graczami
    default: true
  tradeplugin.admin:
    description: Dostęp do historii handlu i komend administracyjnych
    default: op
